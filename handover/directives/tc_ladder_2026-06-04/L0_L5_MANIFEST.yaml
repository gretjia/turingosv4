l5_entry_gate:
  gate_id: L5_ENTRY_LADDER_GATE
  mode: fail_closed
  required_green_receipts:
    - L0
    - L1
    - L2
    - L3
    - L4
  receipt_validation:
    source: handover/evidence/tc_ladder_2026-06-04/
    required_fields:
      - level
      - manifest_id
      - green
      - command
      - exit_code
      - evidence_path
  missing_or_red_receipt: block_l5_entry

hard_claim_c_gate:
  claim_id: Claim C
  start_requires_gate: L5_ENTRY_LADDER_GATE
  when_gate_missing: blocked
  allowed_report_mode: descriptive_only
  claim_headline: forbidden
  claim_start_record_must_include:
    - manifest_id
    - l5_entry_gate
    - l0_l4_receipt_paths
    - parity_schema_id

claim_language:
  replay_green_means: provenance_and_anti_tamper_only
  l5_without_gate_means: descriptive_progress_report_only
  strong_outcome_language_requires: no_proven_checklist_g1_g6_plus_clean_context_audit
